name: Build plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, fileinfo, openssl, curl
          tools: composer

      - name: Install dependencies (dev — needed for Strauss)
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: |
          php tests/test-attachment-sync.php
          php tests/test-connection-migration.php
          php tests/test-upload-delete-check.php
          php tests/test-url-rewriter.php
          php tests/test-batch-processor.php

      - name: Build (Strauss scope + AWS data prune + no-dev autoloader)
        run: php build.php

      - name: Package production zip
        run: php package.php

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-r2-offload
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      # Tag pushes (v1.5.0 etc.) also publish the zip as a GitHub Release asset.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
